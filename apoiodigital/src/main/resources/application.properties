spring.application.name=apoiodigital

spring.ai.google.genai.api-key=${APIKEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash-lite
spring.ai.google.genai.chat.options.response-mime-type=application/json

# mysql — all credentials come from environment variables, no hardcoded defaults.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ApoioDigitalDB}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — schema is owned by Flyway migrations (see src/main/resources/db/migration);
# Hibernate only validates the mapping against it, it never generates DDL itself.
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB

# Text-to-speech synthesis for the ScreenContextDefiner agent (Agente Z). Uses the same
# Gemini API key configured above. Audio files are written to disk and served back through
# AudioController; storage-dir may be pointed at a mounted volume in production.
app.tts.enabled=${TTS_ENABLED:true}
app.tts.api-key=${APIKEY}
app.tts.model=${TTS_MODEL:gemini-2.5-flash-preview-tts}
app.tts.voice=${TTS_VOICE:Kore}
app.audio.storage-dir=${AUDIO_STORAGE_DIR:audio-storage}

#server.address=0.0.0.0
server.port=8080

